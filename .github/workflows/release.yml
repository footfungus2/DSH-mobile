name: Build IPA & publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen 2>/dev/null || true
          xcodegen generate

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" DSHMobile/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project DSHMobile.xcodeproj -scheme DSHMobile \
            -configuration Release -sdk iphoneos \
            -derivedDataPath ci-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find ci-build/Build/Products/Release-iphoneos -maxdepth 1 -name "DSHMobile.app")
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr DSH-Mobile.ipa Payload

      - name: Write SideStore manifest
        run: |
          cat > manifest.json <<EOF
          {
            "apps": [
              {
                "title": "DSH Mobile",
                "url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/DSH-Mobile.ipa",
                "bundleIdentifier": "com.yourname.DSHMobile",
                "version": "${VERSION}"
              }
            ]
          }
          EOF

      - name: Create release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "DSH Mobile $GITHUB_REF_NAME" \
            DSH-Mobile.ipa manifest.json
