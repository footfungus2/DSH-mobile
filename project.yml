name: DSHMobile
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  DSHMobile:
    type: application
    platform: iOS
    sources: [DSHMobile/Sources, DSHMobile/Assets.xcassets]
    info:
      path: DSHMobile/Info.plist
      properties:
        CFBundleDisplayName: DSH Mobile
        UILaunchScreen: {}
        NSFaceIDUsageDescription: DSH Mobile uses Face ID to keep your conversations private on this device.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
  DSHMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DSHMobile/Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: DSHMobile
